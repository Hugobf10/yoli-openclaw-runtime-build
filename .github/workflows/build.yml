name: Build pinned OpenClaw runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  OPENCLAW_REPOSITORY: openclaw/openclaw
  OPENCLAW_COMMIT: c5fb142dd49abe1447d21b644aed6ea80b85df0f
  IMAGE_NAME: ghcr.io/hugobf10/yoli-openclaw

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          docker system df || true

      - name: Fetch pinned OpenClaw source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/openclaw
          git -C upstream/openclaw init -q
          git -C upstream/openclaw remote add origin "https://github.com/${OPENCLAW_REPOSITORY}.git"
          git -C upstream/openclaw fetch --filter=blob:none --depth=1 origin "${OPENCLAW_COMMIT}"
          git -C upstream/openclaw checkout --detach FETCH_HEAD
          test "$(git -C upstream/openclaw rev-parse HEAD)" = "${OPENCLAW_COMMIT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: upstream/openclaw
          file: upstream/openclaw/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.OPENCLAW_COMMIT }}
            ${{ env.IMAGE_NAME }}:openclaw-2026.9.7
          build-args: |
            OPENCLAW_DOCKER_BUILD_SKIP_DTS=1
            OPENCLAW_DOCKER_BUILD_NODE_OPTIONS=--max-old-space-size=4096
          no-cache: true
          provenance: false
          sbom: false

      - name: Capture published digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_NAME}:${OPENCLAW_COMMIT}" \
            --format '{{json .Manifest}}' | tee openclaw-image-attestation.json

      - name: Upload digest attestation
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-runtime-attestation-${{ env.OPENCLAW_COMMIT }}
          path: openclaw-image-attestation.json
